
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Profile & Repo Explorer</title>
  <link rel="stylesheet" href="Task2EazyCSS.css">
</head>
<body>

  <!-- Main Container -->
  <div class="container">

    <!-- Search Box Section -->
    <div class="search-box">
      <input type="text" id="username" placeholder="Enter GitHub username (e.g., octocat)" />
      <button onclick="getUserData()">Search Profile</button>
    </div>

    <!-- Profile Card Component -->
    <div class="profile-card" id="profileCard">
      <p>Search a user above to load profile details into this table.</p>
    </div>

  </div>

  <!-- Place JS script here at the bottom -->
  <script src="Task2EazyJS.js"></script>
</body>
</html>
